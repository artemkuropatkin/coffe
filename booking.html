<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование — МЕЛЛКОФНОСТЬ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="logo">МЕЛЛКОФНОСТЬ</a>
            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">Главная</a></li>
                    <li><a href="menu.html" class="nav__link">Меню</a></li>
                    <li><a href="about.html" class="nav__link">О нас</a></li>
                    <li><a href="booking.html" class="nav__link nav__link--active">Бронирование</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="booking" class="booking">
        <div class="container booking__container">
            <h2 class="section-title">Забронировать столик</h2>
            <div class="booking__form-wrapper">
                <form class="booking__form">
                    <div class="form-group">
                        <input type="text" placeholder="Ваше имя" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" placeholder="Номер телефона" required>
                    </div>
                    <div class="form-row">
                        <input type="date" required>
                        <input type="time" required>
                    </div>
                    <div class="form-group">
                        <select required>
                            <option value="" disabled selected>Количество гостей</option>
                            <option value="1">1 человек</option>
                            <option value="2">2 человека</option>
                            <option value="3">3 человека</option>
                            <option value="4">4 человека</option>
                            <option value="5+">5+ человек</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn--primary btn--block">Подтвердить бронь</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 МЕЛЛКОФНОСТЬ. Все права защищены. В ритме города.</p>
        </div>
    </footer>

</body>
</html>
